        createdAt:
          format: date-time
          type: string
        discountAmount:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        expiresAt:
          format: date-time
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        items:
          items:
