      bearerFormat: JWT
      scheme: bearer
      type: http
    businessBearerAuth:
      bearerFormat: JWT
      description: 登录后复制 data.accessToken，仅输入 token，无需手动添加 Bearer 前缀。
      scheme: bearer
      type: http
