        - price
        - vipPrice
        - shopDesc
        - delivery
        - shopName
        - description
      type: object
    ProductApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - properties:
            data:
              $ref: '#/components/schemas/Product'
          required:
            - data
          type: object
    ProductPage:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/Product'
          type: array
        page:
