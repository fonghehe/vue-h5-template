components:
  parameters:
    Page:
      in: query
      name: page
      schema:
        default: 1
        minimum: 1
        type: integer
    PageSize:
      in: query
      name: pageSize
      schema:
        default: 10
        maximum: 50
        minimum: 1
        type: integer
  responses:
    BusinessError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessEnvelope'
      description: 业务错误：400 请求错误、401 未登录、403 无权限、404 不存在、409 状态冲突、422 校验失败、429 限流、500 内部错误、503 不可用、504 超时；以信封 code 为准。
    Error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
      description: 业务错误：400 请求错误、401 未登录、403 无权限、404 不存在、409 状态冲突、422 校验失败、429 限流、500 内部错误、503 不可用；以信封 code 为准。
  schemas:
    ApiErrorPayload:
      additionalProperties: true
      type: object
    BaseApiResponse:
      properties:
        code:
          type: integer
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiErrorPayload'
            - type: string
            - type: 'null'
        message:
          type: string
      required:
        - code
        - message
      type: object
    BusinessCartItem:
      properties:
        createdAt:
          format: date-time
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        quantity:
          format: int64
          minimum: 0
          type: integer
        sku:
          $ref: '#/components/schemas/BusinessProductSKU'
        skuId:
          format: int64
          minimum: 0
          type: integer
        updatedAt:
          format: date-time
          type: string
        userId:
          format: int64
          minimum: 0
          type: integer
      required:
        - id
        - userId
        - skuId
        - quantity
        - createdAt
        - updatedAt
        - sku
      type: object
    BusinessCartItemRequest:
      properties:
        quantity:
          example: 1
          format: int64
          maximum: 99
          minimum: 1
          type: integer
        skuId:
          example: 1
          format: int64
          minimum: 1
          type: integer
      required:
        - skuId
        - quantity
      type: object
    BusinessCartQuantityRequest:
      properties:
        quantity:
          example: 2
          format: int64
          maximum: 99
          minimum: 1
          type: integer
      required:
        - quantity
      type: object
    BusinessCreateOrderRequest:
      properties:
        couponCode:
          description: 可选优惠券代码；不使用时发送 {}。
          maxLength: 64
          type: string
      type: object
    BusinessDeleteResult:
      properties:
        deleted:
          type: boolean
        id:
          format: int64
          type: integer
      required:
        - deleted
        - id
      type: object
    BusinessEnvelope:
      properties:
        code:
          format: int64
          type: integer
        data:
          nullable: true
        error:
          description: 内部错误详情不会对外暴露。
          nullable: true
        message:
          type: string
        requestId:
          type: string
      required:
        - code
        - message
        - data
        - error
        - requestId
      type: object
    BusinessFavoriteRequest:
      properties:
        favorite:
          example: true
          type: boolean
        productId:
          example: 1
          format: int64
          minimum: 1
          type: integer
      required:
        - productId
      type: object
    BusinessFavoriteResult:
      properties:
        favorite:
          type: boolean
        productId:
          format: int64
          type: integer
      required:
        - productId
        - favorite
      type: object
    BusinessHealth:
      properties:
        env:
          type: string
        service:
          example: business
          type: string
        status:
          example: ok
          type: string
        time:
          format: date-time
          type: string
      type: object
    BusinessInventory:
      properties:
        available:
          format: int64
          minimum: 0
          type: integer
        createdAt:
          format: date-time
          type: string
        reserved:
          format: int64
          minimum: 0
          type: integer
        skuId:
          format: int64
          minimum: 0
          type: integer
        updatedAt:
          format: date-time
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - skuId
        - available
        - reserved
        - version
        - createdAt
        - updatedAt
      type: object
    BusinessLoginRequest:
      properties:
        password:
          example: '123456'
          format: password
          maxLength: 128
          type: string
        username:
          example: user
          maxLength: 64
          type: string
      required:
        - username
        - password
      type: object
    BusinessLoginResult:
      allOf:
        - $ref: '#/components/schemas/BusinessUser'
        - properties:
            accessToken:
              type: string
            expiresIn:
              description: 访问令牌有效期，秒。
              format: int64
              type: integer
          required:
            - accessToken
            - expiresIn
          type: object
    BusinessOrder:
      properties:
        cancelledAt:
          format: date-time
          nullable: true
          type: string
        couponId:
          format: int64
          minimum: 0
          nullable: true
          type: integer
        createdAt:
          format: date-time
          type: string
        discountAmount:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        expiresAt:
          format: date-time
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        items:
          items:
            $ref: '#/components/schemas/BusinessOrderItem'
          nullable: true
          type: array
        orderNo:
          type: string
        originalAmount:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        paidAt:
          format: date-time
          nullable: true
          type: string
        payableAmount:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        status:
          enum:
            - PENDING_PAYMENT
            - PAID
            - PROCESSING
            - COMPLETED
            - CANCELLED
            - EXPIRED
          type: string
        statusHistory:
          items:
            $ref: '#/components/schemas/BusinessOrderStatusHistory'
          nullable: true
          type: array
        updatedAt:
          format: date-time
          type: string
        userId:
          format: int64
          minimum: 0
          type: integer
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - id
        - orderNo
        - userId
        - status
        - originalAmount
        - discountAmount
        - payableAmount
        - createdAt
        - updatedAt
        - expiresAt
        - version
      type: object
    BusinessOrderItem:
      properties:
        id:
          format: int64
          minimum: 0
          type: integer
        orderId:
          format: int64
          minimum: 0
          type: integer
        productId:
          format: int64
          minimum: 0
          type: integer
        productName:
          type: string
        quantity:
          format: int64
          minimum: 0
          type: integer
        skuId:
          format: int64
          minimum: 0
          type: integer
        skuName:
          type: string
        unitPrice:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
      required:
        - id
        - orderId
        - productId
        - skuId
        - productName
        - skuName
        - unitPrice
        - quantity
      type: object
    BusinessOrderPage:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/BusinessOrder'
          type: array
        page:
          format: int64
          minimum: 1
          type: integer
        pageSize:
          format: int64
          maximum: 50
          minimum: 1
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
        - hasMore
      type: object
    BusinessOrderStatusHistory:
      properties:
        createdAt:
          format: date-time
          type: string
        fromStatus:
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        orderId:
          format: int64
          minimum: 0
          type: integer
        reason:
          type: string
        toStatus:
          type: string
      required:
        - id
        - orderId
        - fromStatus
        - toStatus
        - reason
        - createdAt
      type: object
    BusinessOrderStatusRequest:
      properties:
        status:
          enum:
            - PROCESSING
            - COMPLETED
          type: string
      required:
        - status
      type: object
    BusinessPayment:
      properties:
        amount:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        createdAt:
          format: date-time
          type: string
        failureReason:
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        orderId:
          format: int64
          minimum: 0
          type: integer
        paidAt:
          format: date-time
          nullable: true
          type: string
        provider:
          type: string
        reference:
          type: string
        status:
          enum:
            - PENDING
            - SUCCEEDED
            - FAILED
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - orderId
        - provider
        - reference
        - amount
        - status
        - createdAt
        - updatedAt
      type: object
    BusinessPaymentCallback:
      properties:
        amount:
          description: 人民币分。
          format: int64
          minimum: 0
          type: integer
        eventId:
          type: string
        orderNo:
          type: string
        reference:
          type: string
        status:
          enum:
            - SUCCESS
            - FAILURE
          type: string
      required:
        - eventId
        - orderNo
        - reference
        - amount
        - status
      type: object
    BusinessProduct:
      properties:
        brand:
          type: string
        categoryId:
          type: string
        cover:
          type: string
        createdAt:
          format: date-time
          type: string
        delivery:
          type: string
        description:
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        imgUrl:
          type: string
        name:
          type: string
        price:
          type: string
        shopDesc:
          type: string
        shopName:
          type: string
        skus:
          items:
            $ref: '#/components/schemas/BusinessProductSKU'
          nullable: true
          type: array
        title:
          type: string
        updatedAt:
          format: date-time
          type: string
        vipPrice:
          type: string
      required:
        - id
        - name
        - categoryId
        - brand
        - cover
        - title
        - imgUrl
        - price
        - vipPrice
        - shopDesc
        - delivery
        - shopName
        - description
        - createdAt
        - updatedAt
      type: object
    BusinessProductInput:
      properties:
        brand:
          maxLength: 120
          type: string
        categoryId:
          maxLength: 64
          type: string
        cover:
          maxLength: 500
          type: string
        delivery:
          maxLength: 60
          type: string
        description:
          maxLength: 5000
          type: string
        featured:
          type: boolean
        imgUrl:
          maxLength: 500
          type: string
        name:
          maxLength: 255
          type: string
        price:
          maxLength: 32
          type: string
        shopDesc:
          maxLength: 120
          type: string
        shopName:
          maxLength: 120
          type: string
        status:
          enum:
            - draft
            - on_sale
            - sold_out
          type: string
        stock:
          format: int64
          minimum: 0
          type: integer
        title:
          maxLength: 255
          type: string
        vipPrice:
          maxLength: 32
          type: string
      required:
        - title
        - imgUrl
        - price
        - vipPrice
        - shopName
      type: object
    BusinessProductPage:
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/BusinessProduct'
          type: array
        page:
          format: int64
          minimum: 1
          type: integer
        pageSize:
          format: int64
          maximum: 50
          minimum: 1
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
        - hasMore
      type: object
    BusinessProductPatch:
      properties:
        brand:
          maxLength: 120
          type: string
        categoryId:
          maxLength: 64
          type: string
        cover:
          maxLength: 500
          type: string
        delivery:
          maxLength: 60
          type: string
        description:
          maxLength: 5000
          type: string
        featured:
          type: boolean
        imgUrl:
          maxLength: 500
          type: string
        name:
          maxLength: 255
          type: string
        price:
          maxLength: 32
          type: string
        shopDesc:
          maxLength: 120
          type: string
        shopName:
          maxLength: 120
          type: string
        status:
          enum:
            - draft
            - on_sale
            - sold_out
          type: string
        stock:
          format: int64
          minimum: 0
          type: integer
        title:
          maxLength: 255
          type: string
        vipPrice:
          maxLength: 32
          type: string
      type: object
    BusinessProductSKU:
      properties:
        attributes:
          additionalProperties:
            type: string
          type: object
        createdAt:
          format: date-time
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        inventory:
          allOf:
            - $ref: '#/components/schemas/BusinessInventory'
          nullable: true
        name:
          type: string
        originalPrice:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        price:
          description: 人民币分，整数最小货币单位。
          format: int64
          minimum: 0
          type: integer
        productId:
          format: int64
          minimum: 0
          type: integer
        skuCode:
          type: string
        status:
          enum:
            - active
            - inactive
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - productId
        - skuCode
        - name
        - attributes
        - price
        - originalPrice
        - status
        - createdAt
        - updatedAt
      type: object
    BusinessReady:
      properties:
        database:
          example: up
          type: string
        service:
          example: business
          type: string
        status:
          example: ready
          type: string
      type: object
    BusinessRefreshRequest:
      properties:
        refreshToken:
          description: 可选；浏览器默认使用 HttpOnly 刷新 cookie。
          type: string
      type: object
    BusinessSKUInput:
      properties:
        attributes:
          additionalProperties:
            type: string
          example:
            颜色: 黑色
          type: object
        available:
          description: 仅创建时用于初始化库存；更新 SKU 不修改库存。
          example: 100
          format: int64
          minimum: 0
          type: integer
        name:
          example: 标准款
          maxLength: 255
          type: string
        originalPrice:
          example: 12900
          format: int64
          minimum: 0
          type: integer
        price:
          description: 人民币分。
          example: 9900
          format: int64
          minimum: 0
          type: integer
        skuCode:
          example: SKU-NEW-001
          maxLength: 80
          type: string
        status:
          enum:
            - active
            - inactive
          example: active
          type: string
      required:
        - skuCode
        - name
        - attributes
        - status
      type: object
    BusinessUser:
      properties:
        avatar:
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        realName:
          type: string
        roles:
          items:
            enum:
              - user
              - admin
            type: string
          type: array
        username:
          type: string
      required:
        - id
        - username
        - realName
        - avatar
        - roles
      type: object
    ChatMessage:
      properties:
        content:
          type: string
        id:
          type: string
        role:
          enum:
            - user
            - assistant
            - system
          type: string
      required:
        - id
        - role
        - content
      type: object
    ChatRequest:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
      required:
        - messages
      type: object
    CreateOrderRequest:
      properties:
        couponCode:
          description: 可选优惠券代码；不使用时发送 {}。
          maxLength: 64
          type: string
      type: object
    EmptyApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - properties:
            data:
              type: 'null'
          type: object
    Envelope:
      properties:
        code:
          format: int64
          type: integer
        data:
          nullable: true
        error:
          description: 内部错误详情不会对外暴露。
          nullable: true
        message:
          type: string
        requestId:
          type: string
      required:
        - code
        - message
        - data
        - error
        - requestId
      type: object
    FavoriteApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - properties:
            data:
              $ref: '#/components/schemas/FavoriteResult'
          required:
            - data
          type: object
    FavoriteRequest:
      properties:
        favorite:
          type: boolean
        productId:
          type: integer
      required:
        - productId
        - favorite
      type: object
    FavoriteResult:
      properties:
        favorite:
          type: boolean
        productId:
          type: integer
      required:
        - productId
        - favorite
      type: object
    LoginApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - properties:
            data:
              $ref: '#/components/schemas/LoginResult'
          required:
            - data
          type: object
    LoginRequest:
      properties:
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    LoginResult:
      allOf:
        - $ref: '#/components/schemas/User'
        - properties:
            accessToken:
              type: string
          required:
            - accessToken
          type: object
