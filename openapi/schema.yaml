        realName:
          type: string
        roles:
          items:
            type: string
          type: array
        username:
          type: string
      required:
        - id
        - username
        - realName
        - avatar
        - roles
      type: object
    UserApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - properties:
            data:
              $ref: '#/components/schemas/User'
          required:
            - data
          type: object
