            - EXPIRED
          type: string
        statusHistory:
          items:
            $ref: '#/components/schemas/OrderStatusHistory'
          nullable: true
          type: array
        updatedAt:
          format: date-time
          type: string
        userId:
          format: int64
          minimum: 0
          type: integer
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - id
        - orderNo
        - userId
        - status
        - originalAmount
        - discountAmount
        - payableAmount
        - createdAt
        - updatedAt
        - expiresAt
        - version
      type: object
    OrderItem:
      properties:
        id:
