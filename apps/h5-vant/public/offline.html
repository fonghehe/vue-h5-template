<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1989fa" />
    <title>Offline · Vue H5 Template</title>
    <style>
      *{box-sizing:border-box}body{display:grid;min-height:100dvh;margin:0;padding:24px;color:#1f2a37;font:16px/1.6 system-ui,sans-serif;background:#f4f8fc;place-items:center}.card{max-width:360px;padding:28px;background:#fff;border:1px solid #e3ebf4;border-radius:22px;box-shadow:0 18px 45px #17549117}h1{margin:0 0 8px;font-size:25px}p{margin:0 0 20px;color:#748094}.retry{display:inline-block;padding:11px 16px;color:#fff;text-decoration:none;background:#1989fa;border-radius:12px}
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>The application shell is available, but live API data needs a network connection.</p>
      <a class="retry" href="./">Try again</a>
    </main>
  </body>
</html>
